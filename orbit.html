<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbit Explorer - Solar System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css"> <!-- Reuse home design tokens -->
    <link rel="stylesheet" href="orbit.css">
</head>
<body class="orbit-page">

    <!-- 3D Canvas Container -->
    <div id="orbit-3d-container"></div>

    <!-- Mission Branding (Top Left) -->
    <div class="brand-logo-container">
        <div class="brand-icon">
            <i class="fa-solid fa-satellite"></i>
        </div>
        <div class="brand-text">
            <div class="brand-title">COSMOS</div>
            <div class="brand-subtitle">EXPLORER</div>
        </div>
    </div>

    <!-- UI Overlays -->
    <nav class="saas-nav">
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="planets.html">Planets</a>
            <a href="orbit.html" class="active">Orbit</a>
            <a href="quiz.html">Quiz</a>
            <a href="funfacts.html">Fun Facts</a>
        </div>
    </nav>

    <div class="command-center">
        <div class="glass-panel command-panel">
            <h2 class="section-title" style="font-size: 1.5rem; margin-bottom: 20px;">System Command</h2>
            
            <div class="control-group">
                <label>Time Progression</label>
                <input type="range" id="speed-slider" min="0" max="100000" value="100" class="styled-slider">
                <div class="value-display"><span id="speed-val">100x</span> real-time</div>
            </div>

            <div class="control-group">
                <label>Target Body</label>
                <select id="target-select" class="styled-select">
                    <option value="Sun">Sun (Center)</option>
                    <option value="Mercury">Mercury</option>
                    <option value="Venus">Venus</option>
                    <option value="Earth">Earth</option>
                    <option value="Mars">Mars</option>
                    <option value="Jupiter">Jupiter</option>
                    <option value="Saturn">Saturn</option>
                    <option value="Uranus">Uranus</option>
                    <option value="Neptune">Neptune</option>
                </select>
            </div>

            <div class="live-stats" id="live-stats" style="margin-bottom: 20px;">
                <div class="stat-line">Distance: <span id="stat-dist">--</span> M km</div>
            </div>

            <!-- Navigation Hints -->
            <div style="font-size: 0.65rem; color: rgba(100, 160, 255, 0.4); border-top: 1px solid rgba(255,255,255,0.05); padding-top: 15px; text-transform: uppercase; letter-spacing: 1px;">
                <div style="margin-bottom: 5px;"><i class="fa-solid fa-mouse-pointer" style="margin-right: 5px;"></i> Drag to Rotate</div>
                <div><i class="fa-solid fa-arrows-up-down" style="margin-right: 5px;"></i> Scroll to Zoom</div>
            </div>
        </div>
    </div>



    <!-- 6. FOOTER SECTION -->
    <footer class="minimalist-footer">
        <div class="footer-content">
            <p>Designed & Developed by <span style="color: #66b3ff; font-weight: 500;">Krisha Vaghani</span></p>
            <div class="footer-links">
                <a href="index.html#about">About</a>
                <a href="planets.html">Planets</a>
                <a href="quiz.html">Quiz</a>
            </div>
        </div>
    </footer>
</body>
</html>
