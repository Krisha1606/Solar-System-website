<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbit Explorer - Solar System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css"> <!-- Reuse home design tokens -->
    <link rel="stylesheet" href="orbit.css">
</head>
<body class="orbit-page">

    <!-- 3D Canvas Container -->
    <div id="orbit-3d-container"></div>

    <!-- Mission Branding (Top Left) -->
    <div class="brand-logo-container">
        <div class="brand-icon">
            <i class="fa-solid fa-satellite"></i>
        </div>
        <div class="brand-text">
            <div class="brand-title">COSMOS</div>
            <div class="brand-subtitle">EXPLORER</div>
        </div>
    </div>

    <!-- UI Overlays -->
    <nav class="saas-nav">
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="planets.html">Planets</a>
            <a href="orbit.html" class="active">Orbit</a>
            <a href="quiz.html">Quiz</a>
            <a href="funfacts.html">Fun Facts</a>
        </div>
    </nav>

    <div class="command-center">
        <div class="glass-panel command-panel">
            <h2 class="section-title" style="font-size: 1.5rem; margin-bottom: 20px;">System Command</h2>
            
            <div class="control-group">
                <label>Time Progression</label>
                <input type="range" id="speed-slider" min="0" max="100000" value="100" class="styled-slider">
                <div class="value-display"><span id="speed-val">100x</span> real-time</div>
            </div>

            <div class="control-group">
                <label>Target Body</label>
                <select id="target-select" class="styled-select">
                    <option value="Sun">Sun (Center)</option>
                    <option value="Mercury">Mercury</option>
                    <option value="Venus">Venus</option>
                    <option value="Earth">Earth</option>
                    <option value="Mars">Mars</option>
                    <option value="Jupiter">Jupiter</option>
                    <option value="Saturn">Saturn</option>
                    <option value="Uranus">Uranus</option>
                    <option value="Neptune">Neptune</option>
                </select>
            </div>

            <div class="live-stats" id="live-stats" style="margin-bottom: 20px;">
                <div class="stat-line">Distance: <span id="stat-dist">--</span> M km</div>
            </div>

            <!-- Navigation Hints -->
            <div style="font-size: 0.65rem; color: rgba(100, 160, 255, 0.4); border-top: 1px solid rgba(255,255,255,0.05); padding-top: 15px; text-transform: uppercase; letter-spacing: 1px;">
                <div style="margin-bottom: 5px;"><i class="fa-solid fa-mouse-pointer" style="margin-right: 5px;"></i> Drag to Rotate</div>
                <div><i class="fa-solid fa-arrows-up-down" style="margin-right: 5px;"></i> Scroll to Zoom</div>
            </div>
        </div>
    </div>



    <!-- Tooltip -->
    <div id="cursor-tooltip" class="cursor-tooltip"></div>

    <!-- 6. FOOTER SECTION -->
    <footer class="minimalist-footer">
        <div class="footer-content">
            <p>Designed & Developed by <span style="color: #66b3ff; font-weight: 500;">Krisha Vaghani</span></p>
            <div class="footer-links">
                <a href="index.html#about">About</a>
                <a href="planets.html">Planets</a>
                <a href="quiz.html">Quiz</a>
            </div>
        </div>
    </footer>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <!-- Custom Scripts -->
    <script src="js/data-fetcher.js"></script>
    <script src="js/space-engine.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // 1. Initialize Engine
            const engine = new SpaceEngine('orbit-3d-container', {
                sunScale: 5,
                planetScale: 1,
                distanceScale: 0.000001,
                timeScale: 100,
                autoRotate: false,
                showOrbits: true
            });

            // 2. NASA JPL Sync (Optional but recommended for start)
            await engine.syncWithJPL();

            // 3. Command Center Logic
            const speedSlider = document.getElementById('speed-slider');
            const speedVal = document.getElementById('speed-val');
            const targetSelect = document.getElementById('target-select');
            const statDist = document.getElementById('stat-dist');

            speedSlider.addEventListener('input', () => {
                const val = speedSlider.value;
                engine.options.timeScale = val;
                speedVal.textContent = val + "x";
            });

            targetSelect.addEventListener('change', () => {
                engine.focusBody(targetSelect.value);
            });

            // 4. Position & Stats Loop
            function updateStats() {
                if (engine.targetBody) {
                    const radius = engine.targetBody.userData.baseDist || 0;
                    statDist.textContent = radius.toFixed(1);
                } else {
                    statDist.textContent = "--";
                }
                requestAnimationFrame(updateStats);
            }
            updateStats();

            // Refresh NASA Data every 10 mins
            setInterval(() => engine.syncWithJPL(), 600000);
        });
    </script>
</body>
</html>
